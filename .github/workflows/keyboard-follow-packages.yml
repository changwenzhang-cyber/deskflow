name: Keyboard Follow packages

on:
  push:
    branches: [feat/keyboard-follow]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-15
            qt-version: 6.11.2
            arch: arm64
            package-extension: dmg
          - name: windows-x64
            runner: windows-2022
            qt-version: 6.11.2
            arch: amd64
            triplet: x64-windows-release
            package-extension: msi

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: ${{ matrix.arch }}
          spectre: true

      - name: Install dependencies and WiX
        id: dependencies
        uses: ./.github/actions/install-dependencies
        with:
          qt-version: ${{ matrix.qt-version }}
          vcpkg-triplet: ${{ matrix.triplet }}

      - name: Configure macOS ARM64
        if: runner.os == 'macOS'
        shell: bash
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=14
          -DBUILD_TESTS=ON -DSKIP_BUILD_TESTS=ON

      - name: Configure Windows x64
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $toolchain = Join-Path $env:GITHUB_WORKSPACE 'vcpkg/scripts/buildsystems/vcpkg.cmake'
          if (-not (Test-Path $toolchain)) {
            throw "vcpkg toolchain not found: $toolchain"
          }
          cmake -S . -B build -G 'Visual Studio 17 2022' -A x64 `
            "-DCMAKE_TOOLCHAIN_FILE=$toolchain" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-release `
            -DVCPKG_MANIFEST_MODE=OFF `
            -DBUILD_TESTS=ON -DSKIP_BUILD_TESTS=ON

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 8

      - name: Stage translations for Visual Studio tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/src/translations | Out-Null
          Copy-Item build/translations/deskflow_*.qm build/src/translations/ -ErrorAction Stop

      - name: Run existing unit and protocol tests
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build/src/unittests --build-config Release --output-on-failure --verbose

      - name: Package macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: cmake --build build --config Release --target package --parallel 8

      - name: Package Windows portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: cpack --config build/CPackConfig.cmake -G ZIP -C Release -B build

      - name: Smoke test Windows portable ZIP
        if: runner.os == 'Windows'
        uses: ./.github/actions/test-package

      - name: Upload Windows portable ZIP
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: keyboard-follow-windows-x64-portable
          path: build/deskflow[-_]*-portable.zip
          if-no-files-found: error

      - name: Package Windows MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cpack --config build/CPackConfig.cmake -G WIX -C Release -B build
          $packageExit = $LASTEXITCODE
          if ($packageExit -ne 0) {
            $wixLog = 'build/_CPack_Packages/win64/WIX/wix.log'
            if (Test-Path $wixLog) {
              Get-Content $wixLog
            } else {
              Write-Warning "WiX log not found: $wixLog"
            }
          }
          exit $packageExit

      - name: Upload WiX log
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: keyboard-follow-windows-x64-wix-log
          path: build/_CPack_Packages/win64/WIX/wix.log
          if-no-files-found: warn

      - name: Confirm requested installer exists
        shell: bash
        run: |
          shopt -s nullglob
          packages=(build/deskflow[-_]*.${{ matrix.package-extension }})
          if (( ${#packages[@]} == 0 )); then
            echo "Expected ${{ matrix.package-extension }} installer was not generated" >&2
            exit 1
          fi
          printf '%s\n' "${packages[@]}"

      - name: Smoke test macOS package
        if: runner.os == 'macOS'
        uses: ./.github/actions/test-package

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: keyboard-follow-${{ matrix.name }}
          path: build/deskflow[-_]*.${{ matrix.package-extension }}
          if-no-files-found: error
